<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Portfolio</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec5ff; font-family: system-ui, "Tahoma", sans-serif; }
  canvas { display: block; touch-action: none; }
  #hint, #loading { position: fixed; left: 50%; transform: translateX(-50%); color: #fff;
    background: rgba(0,0,0,.55); padding: 10px 18px; border-radius: 999px; font-size: 15px; transition: opacity .4s; }
  #hint { bottom: 24px; }
  #loading { top: 50%; }
  #back { position: fixed; top: 16px; right: 16px; padding: 10px 18px; border: 0; border-radius: 999px;
    background: #fff; color: #222; font-size: 15px; cursor: pointer; display: none; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">กำลังโหลดโมเดล… 0%</div>
<div id="hint" style="opacity:0">คลิก/แตะที่บ้านเพื่อเข้าไปดู • ลากเพื่อหมุนมุมมอง</div>
<button id="back">ออกจากบ้าน</button>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ====== ตั้งค่าตรงนี้ ======
const MODEL_URL = './portfolio.glb';        // ชื่อไฟล์ .glb (ตัวพิมพ์เล็ก-ใหญ่ต้องตรง)
const SKY_COLOR = 0x8ec5ff;
const CEILING_LIGHT = 25;                   // ความสว่างไฟในบ้าน (ปรับได้)
const PHOTO_SPOT = 60;                      // ความสว่างสปอตไลต์ส่องรูป (ปรับได้)
// ===========================

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY_COLOR);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a6a3a, 1.3));
const sun = new THREE.DirectionalLight(0xfff1d9, 2.2);
sun.position.set(5, 10, 10);
scene.add(sun);

// ไฟในบ้าน (พิกัดแปลงจาก Blender: x, z, -y)
const ceiling = new THREE.PointLight(0xffd199, CEILING_LIGHT, 12, 1.5);
ceiling.position.set(0, 3.0, -0.3);
scene.add(ceiling);
const spot = new THREE.SpotLight(0xffeedd, PHOTO_SPOT, 10, Math.PI / 5, 0.6, 1.5);
spot.position.set(-1.5, 3.2, -0.6);
spot.target.position.set(-1.5, 1.7, -2.9);
scene.add(spot, spot.target);

// กล้องหมุนดูรอบบ้านก่อนคลิก
const orbitCam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 500);
orbitCam.position.set(6, 3, 15);
const controls = new OrbitControls(orbitCam, renderer.domElement);
controls.target.set(0, 2, 3);
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 4;
controls.maxDistance = 40;
controls.update();

// ====== กล้องเดินเข้าบ้าน (ทำในหน้าเว็บเอง ไม่พึ่งกล้องจากไฟล์ .glb) ======
const V = (x, y, z) => new THREE.Vector3(x, z, -y);   // พิกัด Blender -> three.js
const KEYS = [1, 50, 95, 130, 200];                    // เฟรมเดียวกับใน Blender
const camCurve = new THREE.CatmullRomCurve3(
  [V(6, -15, 3), V(0, -10.5, 2), V(0, -6, 1.7), V(0, -3, 1.7), V(0, -1.6, 1.7)], false, 'centripetal');
const tgtCurve = new THREE.CatmullRomCurve3(
  [V(0, -3, 2), V(0, -3, 1.6), V(0, -2, 1.7), V(0, 2, 1.7), V(0, 3, 1.7)], false, 'centripetal');
const HFOV = [58.7, 61.9, 65.2, 73.7, 73.7];           // มุมมองแนวนอน (องศา)
const WALK_FPS = 30;
const WALK_DUR = (KEYS[KEYS.length - 1] - KEYS[0]) / WALK_FPS;
const BLEND = 0.8;                                     // เวลาเลื่อนจากมุมที่ดูอยู่ไปจุดเริ่มต้น (วินาที)

const walkCam = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 500);
const tmpTarget = new THREE.Vector3();
let walkT = null;                                      // null = ไม่ได้เดิน
let fromPos = new THREE.Vector3(), fromQuat = new THREE.Quaternion(), fromFov = 50;

function setFov(hfovDeg) {
  const aspect = innerWidth / innerHeight;
  const v = 2 * Math.atan(Math.tan(hfovDeg * Math.PI / 360) / aspect) * 180 / Math.PI;
  walkCam.aspect = aspect;
  walkCam.fov = Math.min(v, 100);
  walkCam.updateProjectionMatrix();
}

function sampleWalk(t) {
  const f = Math.min(KEYS[0] + t * WALK_FPS, KEYS[KEYS.length - 1]);
  let i = 0;
  while (i < KEYS.length - 2 && f > KEYS[i + 1]) i++;
  const local = (f - KEYS[i]) / (KEYS[i + 1] - KEYS[i]);
  const u = Math.min((i + local) / (KEYS.length - 1), 1);
  camCurve.getPoint(u, walkCam.position);
  tgtCurve.getPoint(u, tmpTarget);
  walkCam.lookAt(tmpTarget);
  setFov(THREE.MathUtils.lerp(HFOV[i], HFOV[i + 1], local));
}

let activeCam = orbitCam;
let root = null, mixer = null, actions = [], signs = [];
const clock = new THREE.Clock();
const hint = document.getElementById('hint');
const backBtn = document.getElementById('back');
const loading = document.getElementById('loading');

new GLTFLoader().load(MODEL_URL, (gltf) => {
  root = gltf.scene;
  scene.add(root);
  root.traverse(o => { if (/ClickSign/i.test(o.name)) signs.push(o); });
  mixer = new THREE.AnimationMixer(root);
  actions = gltf.animations.map(clip => {
    const a = mixer.clipAction(clip);
    a.setLoop(THREE.LoopOnce);
    a.clampWhenFinished = true;
    return a;
  });
  loading.style.display = 'none';
  hint.style.opacity = 1;
}, (e) => {
  if (e.total) loading.textContent = 'กำลังโหลดโมเดล… ' + Math.round(e.loaded / e.total * 100) + '%';
}, () => {
  loading.textContent = 'โหลดโมเดลไม่ได้ — ตรวจชื่อไฟล์ portfolio.glb และให้เปิดผ่านเว็บเซิร์ฟเวอร์';
});

// ชิ้นส่วนที่นับว่าเป็น "บ้าน" (ชื่อจาก Blender หรือ custom property)
const HOUSE = /^(Wall|Roof|Door|Floor|Ceiling|Lintel|Porch|Chimney|Win)/i;
function isHouse(o) {
  for (let n = o; n; n = n.parent) {
    if ((n.userData && n.userData.portfolio_house) || HOUSE.test(n.name)) return true;
  }
  return false;
}

function enterHouse() {
  if (!root || walkT !== null) return;
  hint.style.opacity = 0;
  signs.forEach(s => s.visible = false);
  controls.enabled = false;
  fromPos.copy(orbitCam.position);
  fromQuat.copy(orbitCam.quaternion);
  fromFov = orbitCam.fov;
  walkT = -BLEND;
  activeCam = walkCam;
  actions.forEach(a => { a.reset(); a.play(); });   // ประตูเปิด
}

function leaveHouse() {
  actions.forEach(a => a.stop());
  if (mixer) mixer.setTime(0);
  walkT = null;
  activeCam = orbitCam;
  controls.enabled = true;
  signs.forEach(s => s.visible = true);
  backBtn.style.display = 'none';
  hint.style.opacity = 1;
}
backBtn.addEventListener('click', leaveHouse);

// คลิกที่บ้าน (แยกจากการลากหมุนกล้อง)
const ray = new THREE.Raycaster();
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || !root || activeCam !== orbitCam) return;
  if (Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const ndc = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, orbitCam);
  const hit = ray.intersectObject(root, true)[0];
  if (hit && isHouse(hit.object)) enterHouse();
});

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  orbitCam.aspect = innerWidth / innerHeight;
  orbitCam.updateProjectionMatrix();
  if (walkT !== null) setFov(walkCam.fov);
});

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (mixer) mixer.update(dt);

  if (walkT !== null) {
    walkT += dt;
    if (walkT < 0) {
      // เลื่อนกล้องจากมุมที่ดูอยู่ ไปยังจุดเริ่มเดิน
      sampleWalk(0);
      const toPos = walkCam.position.clone(), toQuat = walkCam.quaternion.clone(), toFov = walkCam.fov;
      const k = THREE.MathUtils.smoothstep((walkT + BLEND) / BLEND, 0, 1);
      walkCam.position.lerpVectors(fromPos, toPos, k);
      walkCam.quaternion.slerpQuaternions(fromQuat, toQuat, k);
      walkCam.fov = THREE.MathUtils.lerp(fromFov, toFov, k);
      walkCam.updateProjectionMatrix();
    } else {
      sampleWalk(Math.min(walkT, WALK_DUR));
      if (walkT >= WALK_DUR) backBtn.style.display = 'block';
    }
  }

  if (controls.enabled) controls.update();
  renderer.render(scene, activeCam);
});
</script>
</body>
</html>
